[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cti-vla"
version = "0.1.0"
description = "Set-conditioned counterfactual visual token selection for frozen VLA policies"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "torch>=2.0", "Pillow>=9", "protobuf>=4.21"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
